[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttg"
version = "0.1.0"
description = "Training table generator: compiles a season file into a printable training-plan sheet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Typst compiler bundled as a Python package (D-003). Pinned: the template
    # is written against this version's documentation.
    "typst==0.15.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ttg = "ttg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
