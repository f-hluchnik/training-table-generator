[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttg"
version = "0.1.0"
description = "Training table generator: compiles a season file into a printable training-plan sheet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Typst compiler bundled as a Python package (D-003). Pinned: the template
    # is written against this version's documentation.
    "typst==0.15.2",
]

[project.optional-dependencies]
# Pinned like typst: a new release can add rules or errors and break CI unannounced.
dev = ["pytest>=8", "ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
ttg = "ttg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttg = ["plan.typ"]  # the Typst template travels with the package (T-09)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, ruff's own rules.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]
# The sheet's typography (′ ″ – ×) is intentional, not a confusable character.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# `I` is the interval session code (TRAINING_MODEL.md §1), not an ambiguous name.
"tests/*" = ["E741"]

[tool.ruff.lint.isort]
known-local-folder = ["support"]  # tests/support.py, the tests' shared helpers

[tool.mypy]
strict = true
files = ["src"]
