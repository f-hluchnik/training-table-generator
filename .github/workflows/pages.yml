name: pages

# Publishes the landing page and the generator page in site/ (D-051, D-052): the example sheet is built
# from the current code, and the generator page runs the same code in the browser, from a wheel.
# Needs Settings → Pages → Source: GitHub Actions, set by the owner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # The page draws its example sheet from this plan.json.
      - run: ttg build seasons/test-2027.toml -o site/sample
      # The generator page loads this wheel into Pyodide: the package itself, no dependencies (D-052).
      - run: pip wheel . --no-deps -w wheel && cp wheel/ttg-*-py3-none-any.whl site/ttg.whl
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
