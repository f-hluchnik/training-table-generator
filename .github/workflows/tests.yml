name: tests

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The owner's interpreters (D-011); 3.11 is the minimum.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest
      # Build both reference seasons end to end and keep the PDFs for review (T-09).
      - run: |
          ttg build seasons/2026.toml -o out/2026
          ttg build seasons/test-2027.toml -o out/test-2027
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: season-pdfs
          path: out/*/plan.pdf
